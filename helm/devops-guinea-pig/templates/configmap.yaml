apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-guinea-pig.fullname" . }}-db-config
  labels:
    {{- include "devops-guinea-pig.labels" . | nindent 4 }}
data:
  DB_HOST: {{ default (printf "%s-mysql" (include "devops-guinea-pig.fullname" .)) .Values.db.host | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USER: {{ .Values.db.user | quote }}