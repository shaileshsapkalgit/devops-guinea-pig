replicaCount: 2
image:
  repository: java1829/devops-guinea-pig
  tag: "cce3275"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
probes:
  startup:
    type: httpGet
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 12
  liveness:
    type: httpGet
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    type: httpGet
    path: /health
    initialDelaySeconds: 20
    periodSeconds: 10
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    cert-manager.io/cluster-issuer: selfsigned-issuer
  host: "localhost"
  path: /devops-guinea-pig(/|$)(.*)
  tls:
    enabled: true
    secretName: devops-guinea-pig-tls
otel:
  initImage:
    repository: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java
    tag: "2.5.0"
env:
  - name: JAVA_TOOL_OPTIONS
    value: "-javaagent:/otel/opentelemetry-javaagent.jar"
  - name: OTEL_SERVICE_NAME
    value: "devops-guinea-pig"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo.monitoring.svc.cluster.local:4317"
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: "grpc"
  - name: OTEL_TRACES_EXPORTER
    value: "otlp"
  - name: OTEL_METRICS_EXPORTER
    value: "none"
  - name: OTEL_LOGS_EXPORTER
    value: "none"
serviceAccount:
  create: true
  name: ""