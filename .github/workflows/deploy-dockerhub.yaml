name: Build and Push to Docker Hub

on:
  push:
    branches:
      - feature/kind-local-setup

permissions:
  contents: write

env:
  DOCKERHUB_REPOSITORY: java1829/devops-guinea-pig

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -t $DOCKERHUB_REPOSITORY:${{ steps.vars.outputs.IMAGE_TAG }} .

      - name: Push image to Docker Hub
        run: |
          docker push $DOCKERHUB_REPOSITORY:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Update image tag in values.yaml
        run: |
          sed -i "s|tag: .*|tag: \"${{ steps.vars.outputs.IMAGE_TAG }}\"|" helm/devops-guinea-pig/values.yaml

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/devops-guinea-pig/values.yaml
          git commit -m "Update image tag to ${{ steps.vars.outputs.IMAGE_TAG }} [skip ci]"
          git push origin feature/kind-local-setup