<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Guinea Pig - Version 1</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Segoe UI', system-ui, sans-serif;
          background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
          color: #e2e8f0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
        }
        .card {
          max-width: 640px;
          width: 100%;
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.08);
          border-radius: 20px;
          padding: 48px 40px;
          text-align: center;
          backdrop-filter: blur(10px);
        }
        .badge {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(34,197,94,0.12);
          color: #4ade80;
          border: 1px solid rgba(34,197,94,0.3);
          padding: 6px 14px;
          border-radius: 999px;
          font-size: 13px;
          font-weight: 600;
          margin-bottom: 24px;
        }
        .badge::before {
          content: "";
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #4ade80;
          box-shadow: 0 0 8px #4ade80;
        }
        .version-title {
          font-size: 64px;
          font-weight: 900;
          letter-spacing: -0.03em;
          background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          margin-bottom: 16px;
        }
        p.subtitle {
          color: #94a3b8;
          font-size: 18px;
          margin-bottom: 32px;
          line-height: 1.6;
        }
        .footer {
          margin-top: 32px;
          padding-top: 24px;
          border-top: 1px solid rgba(255,255,255,0.08);
          font-size: 13px;
          color: #64748b;
          display: flex;
          justify-content: space-between;
        }
        .footer a { color: #60a5fa; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <div class="badge">Application Online Is Here</div>
    <h1 class="version-title">VERSION 1</h1>
    <p class="subtitle">DevOps Guinea Pig — Spring Boot & Kind Local Setup</p>
    <div class="footer">
        <span>Built by Shailesh Sapkal</span>
        <a href="/health">/health check →</a>
    </div>
</div>
</body>
</html>
